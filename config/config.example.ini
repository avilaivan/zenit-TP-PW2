; ════════════════════════════════════════════════════════════
; ZENIT · Configuración
; Copiá este archivo como config.ini y completalo.
; config.ini NO se sube a GitHub (tiene contraseñas).
; ════════════════════════════════════════════════════════════

; ── Base de datos (XAMPP por defecto) ──
db_host = "localhost"
db_user = "root"
db_pass = ""
db_name = "zenit"

; ── Mail (Gmail) ──
; Recomendado: usar una cuenta de Gmail SOLO para ZENIT (ej: zenit.trivia@gmail.com),
; no tu mail personal: es el remitente que ven todos los jugadores.
; 1. Activá la verificación en 2 pasos en esa cuenta de Google.
; 2. Creá una contraseña de aplicación: https://myaccount.google.com/apppasswords
; 3. Pegá tu Gmail en smtp_usuario y mail_remitente, y la contraseña de 16 letras en smtp_clave.
; Probalo con:  C:\xampp\php\php.exe herramientas\probar_mail.php tucorreo@gmail.com
mail_modo = "smtp"
smtp_host = "smtp.gmail.com"
smtp_puerto = 587
smtp_seguridad = "tls"
smtp_usuario = "tucorreo@gmail.com"
smtp_clave = "xxxx xxxx xxxx xxxx"
mail_remitente = "tucorreo@gmail.com"
mail_nombre = "ZENIT"

; Si XAMPP da error de certificados (TLS), lo correcto es configurar openssl.cafile
; en php.ini (ver README). Como último recurso, SOLO en tu PC, podés poner 0.
smtp_verificar_ssl = 1
