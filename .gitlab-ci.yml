stages:
  - deploy

deploy_infinityfree:
  stage: deploy
  image: alpine:3.20

  before_script:
    - apk add --no-cache lftp

  script:
    - >
      lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
      -e "set ftp:ssl-allow no;
      mirror -R --verbose --no-perms
      --exclude-glob .git
      --exclude-glob .gitlab-ci.yml
      --exclude-glob config/config.ini
      ./ htdocs/;
      bye"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
